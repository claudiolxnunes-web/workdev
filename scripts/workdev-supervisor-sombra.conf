# Drop-in da semana de sombra (etapa E7 do plano).
#
# Suprime a entrega no Telegram enquanto o Supervisor está em observação.
# O relatório continua sendo montado, as métricas continuam indo para o
# journald e para runs.jsonl — só o envio é desligado.
#
# Existe porque o item 7 de E7 pede provar em produção, antes de qualquer
# mensagem sair, que: não há exposição de segredo, a deduplicação funciona,
# a mensagem respeita o limite de 3 achados detalhados e não há spam.
#
# Instalar:
#   install -D -m 0644 scripts/workdev-supervisor-sombra.conf \
#       /etc/systemd/system/workdev-supervisor.service.d/shadow.conf
#   systemctl daemon-reload
#
# Remover (quando a sombra terminar e a entrega for liberada):
#   rm /etc/systemd/system/workdev-supervisor.service.d/shadow.conf
#   systemctl daemon-reload
#
# Conferir o que está valendo:
#   systemctl cat workdev-supervisor.service | tail -5
#
# Este arquivo é versionado de propósito: `deploy_drift` não inspeciona
# drop-ins de systemd, então uma configuração que só existisse em
# /etc/systemd/system sumiria com a máquina sem ninguém detectar. O teste
# `test_drop_in_de_sombra_nao_divergiu_do_repositorio` compara os dois.

[Service]
ExecStart=
ExecStart=/usr/bin/flock -n /run/lock/workdev-supervisor.lock /opt/workdev/apps/api/venv/bin/python -m scripts.supervisor --once --sem-entrega
